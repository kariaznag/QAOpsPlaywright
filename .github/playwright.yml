name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest #the tests will run on the ubuntu operating system
    steps:
    - uses: actions/checkout@v6 #to checkout the latest main branch code
    - uses: actions/setup-node@v6 # to setup the node environment
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci # to install the required dependencies in the package.json file. this covers the installation of azure devops extension and playwright test framework
   # - name: Install Playwright Browsers
   #   run: npx playwright install --with-deps # this step is not needed when using the azure image, azure provides the browsers by default.
    - name: Azure Login # to login to azure devops using the service principal credentials we stored in the secrets 
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }} # where all tests will be triggered 
      run: npx playwright test --grep "@Smoke" --config=playwright.service.config.js --workers=4 # we use the azure config file.
    - uses: actions/upload-artifact@v5 # Upload test report as artifact
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30